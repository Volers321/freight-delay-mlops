# Prediction API: 2+ replicas behind a Service, autoscaled on CPU.
# The prediction log goes to a shared volume read by the monitor CronJob.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fdm-config
data:
  MLFLOW_TRACKING_URI: http://mlflow.mlops.svc.cluster.local:5000
  FDM_MODEL_ALIAS: champion
  FDM_PREDICTION_LOG: /data/predictions.jsonl
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fdm-predictions
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdm-api
  labels: {app: fdm-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: fdm-api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: fdm-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: ghcr.io/volers321/freight-delay-mlops:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: fdm-config}}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts: [{name: predictions, mountPath: /data}]
      volumes:
        - name: predictions
          persistentVolumeClaim: {claimName: fdm-predictions}
---
apiVersion: v1
kind: Service
metadata:
  name: fdm-api
spec:
  selector: {app: fdm-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fdm-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fdm-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
